minimum_pre_commit_version: 4.0.0
exclude: ^LICENSE$|\.(html|csv|svg|patch)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix"]
        types: [python]
      - id: ruff-format
        types: [python]

  # pylint/shellcheck 补充检查
  # 未安装时（如 CI 门禁）自动跳过，详见 scripts/{pylint,shellcheck}_check.sh
  - repo: local
    hooks:
      - id: pylint
        name: pylint (R1710, R0801, W0621)
        entry: bash scripts/pylint_check.sh
        language: system
        types: [python]
        args: ["--rcfile=.pylintrc"]

      - id: shellcheck
        name: shellcheck
        entry: bash scripts/shellcheck_check.sh
        language: system
        types: [shell]
        exclude: \.(csh|fish|tcsh)$
        args:
          - "--exclude=SC3043,SC3044,SC3012,SC1090,SC2229,SC2181,SC2155,SC2162,SC2268,SC2317"

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [
            "-L",
            "CANN,cann,ASCEND,ascend,AND,ND,tbe,alog,DEPENDEES,ThirdParty",
            "--skip",
            "*.py,*.patch",
          ]

  # OAT 合规性检查 (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: true
        types: [file]
        stages: [pre-commit]
        verbose: true
